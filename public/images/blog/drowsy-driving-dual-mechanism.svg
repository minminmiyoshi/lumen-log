<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" style="font-family:'Shippori Mincho B1','Inter',sans-serif">
  <!-- 要因① 睡眠負債 -->
  <rect x="40" y="40" width="280" height="100" rx="8" fill="#F4F0E8" stroke="#8B3A2C" stroke-width="2"/>
  <text x="180" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B1B19">要因① 睡眠負債</text>
  <text x="180" y="95" text-anchor="middle" font-size="12" fill="#4A5859">覚醒16〜24時間</text>
  <text x="180" y="115" text-anchor="middle" font-size="12" fill="#4A5859">アデノシン蓄積 → 睡眠圧↑↑</text>

  <!-- 要因② 概日リズム -->
  <rect x="400" y="40" width="280" height="100" rx="8" fill="#F4F0E8" stroke="#8B3A2C" stroke-width="2"/>
  <text x="540" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#1B1B19">要因② 概日リズムnadir</text>
  <text x="540" y="95" text-anchor="middle" font-size="12" fill="#4A5859">午前2〜6時：覚醒度の最低点</text>
  <text x="540" y="115" text-anchor="middle" font-size="12" fill="#4A5859">体内時計が眠りを要求</text>

  <!-- 矢印：要因① → 合流点 -->
  <line x1="180" y1="140" x2="180" y2="195" stroke="#6E665B" stroke-width="2"/>
  <polygon points="180,205 174,195 186,195" fill="#6E665B"/>

  <!-- 矢印：要因② → 合流点 -->
  <line x1="540" y1="140" x2="540" y2="195" stroke="#6E665B" stroke-width="2"/>
  <polygon points="540,205 534,195 546,195" fill="#6E665B"/>

  <!-- 合流の破線 -->
  <line x1="180" y1="210" x2="220" y2="210" stroke="#6E665B" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="540" y1="210" x2="500" y2="210" stroke="#6E665B" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- 二重パンチ -->
  <rect x="220" y="195" width="280" height="50" rx="8" fill="#8B3A2C"/>
  <text x="360" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#F4F0E8">同時にピーク ＝ 二重パンチ</text>

  <!-- 矢印 → マイクロスリープ -->
  <line x1="360" y1="245" x2="360" y2="280" stroke="#8B3A2C" stroke-width="2.5"/>
  <polygon points="360,290 353,280 367,280" fill="#8B3A2C"/>

  <!-- マイクロスリープ -->
  <rect x="200" y="290" width="320" height="55" rx="8" fill="#1B1B19"/>
  <text x="360" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#F4F0E8">マイクロスリープ（1〜15秒）</text>
  <text x="360" y="335" text-anchor="middle" font-size="12" fill="#D8D2C5">脳が不随意にオフライン → 無制御走行</text>

  <!-- 矢印 → 事故リスク -->
  <line x1="360" y1="345" x2="360" y2="370" stroke="#1B1B19" stroke-width="2"/>
  <polygon points="360,380 353,370 367,370" fill="#1B1B19"/>

  <!-- 事故リスク -->
  <rect x="240" y="380" width="240" height="30" rx="6" fill="#B91C1C"/>
  <text x="360" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">事故リスク急増</text>

  <!-- 補足 -->
  <text x="600" y="310" text-anchor="start" font-size="11" fill="#8B3A2C" font-style="italic">← 気合い・窓開け</text>
  <text x="610" y="325" text-anchor="start" font-size="11" fill="#8B3A2C" font-style="italic">では対抗不可</text>
</svg>
